behaviors:
  Stick:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 300000000
    time_horizon: 512
    summary_freq: 5000
    threaded: false
    self_play:
      save_steps: 25000
      team_change: 200000
      swap_steps: 10000
      window: 25
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

env_settings:
  num_envs: 8  # Number of parallel Unity instances (increase for more training throughput)
  

engine_settings:
  time_scale: 5.0
  no_graphics: true
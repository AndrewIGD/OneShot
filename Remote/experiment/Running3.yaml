behaviors:
  Stick:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.0e-4
      learning_rate_schedule: constant
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
      memory:
        memory_size: 256
        sequence_length: 64
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 400000000
    time_horizon: 128
    summary_freq: 5000
    threaded: false

env_settings:
  num_envs: 8  # Number of parallel Unity instances (increase for more training throughput)
  

engine_settings:
  time_scale: 5.0
  no_graphics: true


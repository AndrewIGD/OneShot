behaviors:
  Stick:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5000000
    time_horizon: 64
    summary_freq: 5000
    threaded: false
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 5000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

env_settings:
  env_path: "F:/Macbook Stuff/Personal/Unity/OneShotBuild/IGDStickBrawlers.exe"
  num_envs: 4  # Number of parallel Unity instances (increase for more training throughput)
  

engine_settings:
  width: 84
  height: 84
  quality_level: 0
  time_scale: 20.0
  target_frame_rate: 60
  capture_frame_rate: 60
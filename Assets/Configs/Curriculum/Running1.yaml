behaviors:
  Stick:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 64
    summary_freq: 5000
    threaded: false

env_settings:
  env_path: "F:/Macbook Stuff/Personal/Unity/OneShotBuild/IGDStickBrawlers.exe"
  num_envs: 24  # Number of parallel Unity instances (increase for more training throughput)
  

engine_settings:
  width: 84
  height: 84
  quality_level: 0
  time_scale: 50.0
  target_frame_rate: 120
  capture_frame_rate: 120
  no_graphics: false

torch_settings:
  device: cuda  # Use "cuda" for GPU, "cpu" for CPU, or "cuda:0" for specific GPU
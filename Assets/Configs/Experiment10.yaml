behaviors:
  Stick:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 60000000
    time_horizon: 512
    summary_freq: 5000
    threaded: false
    self_play:
      save_steps: 25000
      team_change: 200000
      swap_steps: 10000
      window: 100
      play_against_latest_model_ratio: 0.3
      initial_elo: 1300.0

env_settings:
  env_path: "F:/Macbook Stuff/Personal/Unity/OneShotBuild/IGDStickBrawlers.exe"
  num_envs: 12  # Number of parallel Unity instances (increase for more training throughput)
  

engine_settings:
  width: 84
  height: 84
  quality_level: 0
  time_scale: 20.0
  target_frame_rate: 120
  capture_frame_rate: 120
  no_graphics: false

torch_settings:
  device: cuda  # Use "cuda" for GPU, "cpu" for CPU, or "cuda:0" for specific GPU